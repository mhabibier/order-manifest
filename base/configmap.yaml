apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: order-service
  labels:
    app.kubernetes.io/name: order-microservice
    app.kubernetes.io/component: config
data:
  PORT: "3000"
  NODE_ENV: "production"
  JWT_EXPIRES_IN: "1h"
  SERVICE_NAME: "order-microservice"
  SERVICE_VERSION: "1.0.0"

  # ── Observability (Monitoring Stack) ──────────────────────────────────────
  # Format: http://<service-name>.<namespace>.svc.cluster.local:<port>
  # Tetap mengarah ke namespace "monitoring" sebagai pusat observabilitas.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc.cluster.local:4317"
  LOKI_HOST: "http://loki.monitoring.svc.cluster.local:3100"
