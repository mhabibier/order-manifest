# k8s/overlays/development/kustomization.yaml
# Development overlay for order-service.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace harus sinkron dengan base
namespace: order-service

resources:
  - ../../base

# ── Image: point to your private registry with a dev tag ─────────────────────
images:
  - name: registry.yourdomain.com/auth-microservice # Nama image asli di base
    newName: registry.yourdomain.com/order-microservice # Ganti ke image order
    newTag: dev

# ── Patches ───────────────────────────────────────────────────────────────────
patches:
  # Patch Deployment: Kurangi replika dan resource
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: order-service
        namespace: order-service
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: order-service
                resources:
                  requests:
                    cpu:    "50m"
                    memory: "64Mi"
                  limits:
                    cpu:    "200m"
                    memory: "256Mi"

  # Patch HPA: Izinkan scaling down ke 1 pod di dev
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: order-service-hpa
        namespace: order-service
      spec:
        minReplicas: 1
        maxReplicas: 3

# ── Dev-specific config overrides ─────────────────────────────────────────────
configMapGenerator:
  - name: order-service-config
    namespace: order-service
    behavior: merge
    literals:
      - NODE_ENV=development
      - SERVICE_VERSION=dev
